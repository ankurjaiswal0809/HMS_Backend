server:
  port: 8080

spring:
  application:
    name: hospital-management-system

  datasource:
    url: jdbc:mysql://localhost:3306/hms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: yourmail@gmail.com
    password: your_app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: hms-secret-key-123456

# Twilio SMS Configuration
twilio:
  accountSid: YOUR_TWILIO_ACCOUNT_SID
  authToken: YOUR_TWILIO_AUTH_TOKEN
  fromNumber: +1234567890